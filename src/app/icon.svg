<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14112b" />
      <stop offset="100%" stop-color="#070814" />
    </linearGradient>
    <linearGradient id="peakGrad1" x1="4" y1="52" x2="60" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#b09aff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="peakGrad2" x1="12" y1="52" x2="56" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8271df" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="30" y1="8" x2="58" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded cosmic backdrop for high contrast in dark and light browser tabs -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#2d2757" stroke-width="1.5" />
  
  <!-- Celestial Body & Orbital Ring -->
  <circle cx="44" cy="18" r="13" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="16 6" />
  <circle cx="44" cy="18" r="4.5" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="44" cy="18" r="1.5" fill="#ffffff" />
  
  <!-- Mountain ridge 2 (Background Altiplano range) -->
  <path d="M12 50 L27 37 L35 44 L48 33 L56 50" stroke="url(#peakGrad2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Mountain ridge 1 (Foreground peak & crater rim) -->
  <path d="M6 50 L21 27 L31 38 L44 14 L58 50" stroke="url(#peakGrad1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
